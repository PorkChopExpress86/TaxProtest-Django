name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to production server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check for skip-deploy marker
        id: skip
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MSG" == "[skip deploy]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Validate deploy.sh shell syntax
        if: steps.skip.outputs.skip != 'true'
        run: bash -n scripts/deploy.sh

      - name: Set up SSH key
        if: steps.skip.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -T 20 -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" \
            >> "$HOME/.ssh/known_hosts"
          echo "--- known_hosts contents ---"
          cat "$HOME/.ssh/known_hosts"

      - name: Validate SSH connectivity
        if: steps.skip.outputs.skip != 'true'
        env:
          SSH_AUTH_SOCK: ""
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
              -p "${{ secrets.SERVER_PORT }}" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ secrets.PROJECT_PATH }}' && pwd && git rev-parse HEAD"

      - name: Run smart deploy on remote
        if: steps.skip.outputs.skip != 'true'
        env:
          SSH_AUTH_SOCK: ""
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
              -p "${{ secrets.SERVER_PORT }}" \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ secrets.PROJECT_PATH }}' && ./scripts/deploy.sh"
