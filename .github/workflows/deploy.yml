name: Deploy

# Deploy only a main commit whose CI run succeeded. A manual deploy is a
# workflow_dispatch of CI on main, which triggers this workflow when it passes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to production server
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The server deploys origin/main, so deploy only while main still points at
      # the verified commit; a newer commit deploys after its own CI run passes.
      - name: Check for skip-deploy marker and stale commit
        id: skip
        env:
          MSG: ${{ github.event.workflow_run.head_commit.message }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$MSG" == "[skip deploy]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$main_sha" != "$VERIFIED_SHA" ]]; then
            echo "::notice::main moved to ${main_sha:0:12}; skipping deploy of ${VERIFIED_SHA:0:12}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        if: steps.skip.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -T 20 -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" \
            >> "$HOME/.ssh/known_hosts"
          echo "--- known_hosts contents ---"
          cat "$HOME/.ssh/known_hosts"

      - name: Validate SSH connectivity
        if: steps.skip.outputs.skip != 'true'
        env:
          SSH_AUTH_SOCK: ""
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
              -p "${{ secrets.SERVER_PORT }}" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ secrets.PROJECT_PATH }}' && pwd && git rev-parse HEAD"

      - name: Run smart deploy on remote
        if: steps.skip.outputs.skip != 'true'
        env:
          SSH_AUTH_SOCK: ""
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
              -p "${{ secrets.SERVER_PORT }}" \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cd '${{ secrets.PROJECT_PATH }}' && git fetch --quiet origin main && mkdir -p .deploy-state && git show origin/main:scripts/deploy.sh > .deploy-state/target-deploy.sh && bash .deploy-state/target-deploy.sh && rm -f .deploy-state/target-deploy.sh"
