name: CI

on:
  # Every branch push runs CI, so an integration branch is checked on Linux
  # before a PR exists. Pull requests run only from forks, avoiding a second run.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs on other branches are cancelled. Each main run gets its own
# group so every main commit gets a verdict, which Deploy waits on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates & test suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_USER: taxprotest
      POSTGRES_PASSWORD: taxprotest
      POSTGRES_DB: taxprotest
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      SKIP_DATA_DOWNLOAD: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The dev service runs as ${UID}:${GID} over a bind mount of the checkout,
      # and Compose requires the .env file its services name.
      - name: Prepare compose environment
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
          touch .env

      - name: Validate deployment script
        run: |
          bash -n scripts/deploy.sh
          bash scripts/tests/test_deploy.sh

      - name: Build development image
        run: docker compose build taxprotest-dev

      - name: Lint with Ruff
        run: docker compose run --rm taxprotest-dev ruff check .

      - name: Format check with Black
        run: docker compose run --rm taxprotest-dev black --check .

      - name: Type check with Mypy
        run: docker compose run --rm taxprotest-dev mypy taxprotest counties

      - name: Check for unapplied migrations
        run: docker compose run --rm taxprotest-dev python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: docker compose run --rm taxprotest-dev pytest -q

      - name: Clean up compose stack
        if: always()
        run: docker compose down -v --remove-orphans
