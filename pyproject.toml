[tool.black]
line-length = 100
# Target syntax baseline (conservative minimum; Docker runtime is Python 3.14)
target-version = ["py311"]
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 100
# Target syntax baseline (conservative minimum; Docker runtime is Python 3.14)
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "B",  # bugbear
  "UP", # pyupgrade
]
ignore = [
  "E203",  # whitespace before ':' (Black compatibility)
  "E501",  # line length handled pragmatically in legacy code during staged cleanup
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]  # scripts initialize Django before importing project modules
