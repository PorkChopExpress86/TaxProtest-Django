# Production overrides. Service keys MUST match docker-compose.yml exactly --
# a key that does not exist in the base file adds a second service rather than
# overriding the first. (A `db:` key here once did exactly that, running a
# second PostgreSQL on the same pgdata volume as `postgres:`.)
#
# List-valued fields (ports, volumes) MERGE with the base file by default, so
# anything meant to be removed in production needs an explicit `!override`.
services:
  postgres:
    # No ports exposed to host in production; !override clears the base mapping
    # instead of appending to it.
    ports: !override []

  redis:
    # No ports exposed to host in production.
    ports: !override []

  web:
    build: .
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8020:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-taxprotest}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-taxprotest}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,property.ohmygoshwhatever.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://property.ohmygoshwhatever.com}
      - USE_X_FORWARDED_HOST=${USE_X_FORWARDED_HOST:-1}
      - ENABLE_SECURE_PROXY_SSL_HEADER=${ENABLE_SECURE_PROXY_SSL_HEADER:-1}
      - FORCE_SECURE_COOKIES=${FORCE_SECURE_COOKIES:-1}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HCAD_DOWNLOAD_DIR=${HCAD_DOWNLOAD_DIR:-/app/counties/harris/var/downloads}
      - HCAD_EXTRACT_DIR=${HCAD_EXTRACT_DIR:-/app/counties/harris/var/extracted}
      - HCAD_LOG_DIR=${HCAD_LOG_DIR:-/app/counties/harris/var/logs}
      - PROJECT_REPORT_DIR=${PROJECT_REPORT_DIR:-/app/counties/harris/var/reports}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTE: these MERGE with the base file's `.:/app`, so production still runs
    # code from the host checkout rather than from the baked image. Add
    # `volumes: !override` here to make the image the sole source of code --
    # but see scripts/deploy.sh first, whose PARTIAL/SKIP tiers assume a plain
    # `git pull` changes what the containers run.
    volumes:
      - ./counties/harris/var:/app/counties/harris/var
      - ./counties/brazos/var:/app/counties/brazos/var
    # nginx-proxy-manager lives on the external `media_proxy` network and
    # reverse-proxies to http://taxprotest-web:8000 -- by container name, so
    # the container_name in the base file is load-bearing, not cosmetic.
    # Both networks must be listed: naming any network here stops Compose from
    # attaching `default` implicitly, which would cut web off from postgres.
    # Without this the site 502s after every rebuild, since a manual
    # `docker network connect` does not survive container recreation.
    networks:
      - default
      - media_proxy

  # Celery worker for processing background tasks
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-taxprotest}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-taxprotest}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HCAD_DOWNLOAD_DIR=${HCAD_DOWNLOAD_DIR:-/app/counties/harris/var/downloads}
      - HCAD_EXTRACT_DIR=${HCAD_EXTRACT_DIR:-/app/counties/harris/var/extracted}
      - HCAD_LOG_DIR=${HCAD_LOG_DIR:-/app/counties/harris/var/logs}
      - PROJECT_REPORT_DIR=${PROJECT_REPORT_DIR:-/app/counties/harris/var/reports}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A taxprotest worker --loglevel=info

  # Celery beat for scheduled tasks (runs monthly imports)
  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-taxprotest}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-taxprotest}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HCAD_DOWNLOAD_DIR=${HCAD_DOWNLOAD_DIR:-/app/counties/harris/var/downloads}
      - HCAD_EXTRACT_DIR=${HCAD_EXTRACT_DIR:-/app/counties/harris/var/extracted}
      - HCAD_LOG_DIR=${HCAD_LOG_DIR:-/app/counties/harris/var/logs}
      - PROJECT_REPORT_DIR=${PROJECT_REPORT_DIR:-/app/counties/harris/var/reports}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A taxprotest beat --loglevel=info

volumes:
  pgdata:
    driver: local

networks:
  # Created outside this project (by the nginx-proxy-manager stack), so it is
  # declared external rather than managed here.
  media_proxy:
    external: true
